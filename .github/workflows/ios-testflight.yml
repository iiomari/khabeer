name: iOS · TestFlight

# Builds the iOS shell on a GitHub-hosted macOS runner and uploads it to
# TestFlight. Nothing here needs a Mac of your own: signing certificates and
# provisioning profiles are created on the fly from an App Store Connect API
# key (-allowProvisioningUpdates), so there is nothing to export by hand.
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "الموقع الذي يفتحه التطبيق"
        required: false
        default: "https://khabeer-inky.vercel.app"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    env:
      KHABEER_URL: ${{ inputs.site_url }}
      BUNDLE_ID: sa.khabeer.app
      SCHEME: App
      ARCHIVE: ${{ github.workspace }}/build/App.xcarchive
      EXPORT_DIR: ${{ github.workspace }}/build/export

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: تثبيت اعتماديات الغلاف
        working-directory: mobile
        run: npm install

      - name: إنشاء مشروع iOS
        working-directory: mobile
        run: |
          npx cap add ios
          npx cap sync ios

      - name: توليد الأيقونات وشاشة البداية
        working-directory: mobile
        run: npx capacitor-assets generate --ios

      - name: ضبط معرّف الحزمة ورقم البناء
        working-directory: mobile/ios/App
        run: |
          # A build number must be unique per upload; the run number guarantees that.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.${{ github.run_number }}" App/Info.plist
          # Arabic as the primary language so the App Store listing reads correctly.
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion ar" App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string ar" App/Info.plist

      - name: تجهيز مفتاح App Store Connect
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          KEY_P8: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$KEY_P8" > ~/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${KEY_ID}.p8

      - name: الأرشفة
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }} \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Automatic \
            archive

      - name: التصدير إلى ملف ipa
        run: |
          cat > /tmp/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>TEAM_ID_PLACEHOLDER</string>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/TEAM_ID_PLACEHOLDER/${{ secrets.APPLE_TEAM_ID }}/" /tmp/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }}

      - name: الرفع إلى TestFlight
        run: |
          IPA=$(find "$EXPORT_DIR" -name "*.ipa" | head -1)
          echo "uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey ${{ secrets.APPSTORE_KEY_ID }} \
            --apiIssuer ${{ secrets.APPSTORE_ISSUER_ID }}

      - name: حفظ الملف كأثر للتحميل اليدوي
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khabeer-ipa
          path: ${{ env.EXPORT_DIR }}/*.ipa
          if-no-files-found: warn
